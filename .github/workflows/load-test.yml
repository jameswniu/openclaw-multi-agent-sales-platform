# Manual load test. It starts its own mock model and gateway on private ports and drives concurrent chat
# turns. Its pass bounds are wall-clock times, which a shared runner cannot hold steady, so it never runs
# on push or pull request.
name: load-test

on:
  workflow_dispatch:

# The jobs only read the repository, so the workflow token gets read access and nothing else.
permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The runner context is not available in a job-level env block, so a step exports the two paths.
      - name: Keep OpenClaw state in the runner's scratch folder
        run: |
          echo "OPENCLAW_HOME=$RUNNER_TEMP/oc" >> "$GITHUB_ENV"
          echo "OPENCLAW_STATE_DIR=$RUNNER_TEMP/oc/state" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: node scripts/load-test.mjs --users 50 --skip-soak
