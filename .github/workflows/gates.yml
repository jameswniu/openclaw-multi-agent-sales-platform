# CI gates. One job per plugin runs its Vitest suite on Node 22 and uploads the JSON report. A second job
# reads those reports and checks that the README numbers, badges and figures match the repo, that tracked
# prose has no em or en dashes, and that no marker of the old project name is left.
name: gates

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository, so the workflow token gets read access and nothing else.
permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [salesforce, partnerstack, user-memory]
    env:
      OPENCLAW_HOME: ${{ runner.temp }}/oc
      OPENCLAW_STATE_DIR: ${{ runner.temp }}/oc/state
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: plugins/*/package-lock.json
      - name: Install
        working-directory: plugins/${{ matrix.plugin }}
        run: npm ci --no-audit --no-fund
      - name: Vitest with a JSON report
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          mkdir -p ../../.reports
          npx vitest run --reporter=default --reporter=json --outputFile.json=../../.reports/${{ matrix.plugin }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.plugin }}
          path: .reports/${{ matrix.plugin }}.json

  docs-gates:
    needs: plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: .reports
          pattern: report-*
          merge-multiple: true
      - name: Guard demo
        run: node scripts/demo-guard.mjs
      - name: Figures match their generators
        run: make figures-check
      - name: README numbers, badges and figures match the repo
        run: python3 tools/check_readme.py
      - name: No old project name or personal paths
        run: python3 tools/check_readme.py --names
      - name: No em or en dashes in tracked prose
        run: |
          # python, not grep -P, so the check means the same thing on macOS and the runner
          git ls-files -z -- '*.md' | python3 -c '
          import sys
          bad = 0
          for path in sys.stdin.buffer.read().split(b"\0"):
              if not path:
                  continue
              for n, line in enumerate(open(path, encoding="utf-8", errors="replace"), 1):
                  if chr(8212) in line or chr(8211) in line:
                      print(f"{path.decode()}:{n}: {line.rstrip()[:100]}")
                      bad += 1
          print("clean" if not bad else f"{bad} dash glyph line(s)")
          sys.exit(1 if bad else 0)
          '
