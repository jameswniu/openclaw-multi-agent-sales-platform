<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 456" width="100%" role="img" shape-rendering="crispEdges" aria-label="OpenClaw multi-agent sales platform, hardened for a team. 50 concurrent sessions with a 120 second run timeout and a 30 second model timeout, 65 plugin tests across 3 plugins, and 2 of 4 roles holding a write grant with a 25 record bulk cap.">
<rect width="1200" height="456" fill="#0e1117"/>
