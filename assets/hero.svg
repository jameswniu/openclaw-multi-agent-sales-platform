<text x="48" y="112" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" fill="#e6e9ee" font-weight="700">Hardened for a team</text>
<text x="48" y="158" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#8b949e">A stock single-user demo fleet, plus four additions. All data is fictional.</text>
<rect x="48" y="190" width="352" height="192" rx="0" fill="#171c24" stroke="#2c333d" stroke-width="2"/>
