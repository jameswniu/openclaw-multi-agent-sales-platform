<text x="70" y="294" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e6e9ee">concurrent sessions</text>
<text x="70" y="324" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">120 s run timeout</text>
<text x="70" y="354" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">30 s model timeout</text>
<rect x="424" y="190" width="352" height="192" rx="0" fill="#171c24" stroke="#2c333d" stroke-width="2"/>
