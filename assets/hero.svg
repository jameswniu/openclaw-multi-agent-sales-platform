<text x="446" y="252" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="48" fill="#e6e9ee" font-weight="700">65</text>
<text x="446" y="294" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e6e9ee">plugin tests</text>
<text x="446" y="324" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">3 plugins</text>
<text x="446" y="354" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">no key, no network</text>
<rect x="800" y="190" width="352" height="192" rx="0" fill="#171c24" stroke="#2c333d" stroke-width="2"/>
